name: Bug report
description: Report a reproducible bug using synthetic data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real relay endpoints, SSH aliases, session IDs, ports, fingerprints, launchers, keys, connection files, logs, state files, or controlled-machine identities.** Use reserved domains and synthetic fixtures. Report vulnerabilities privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit tested.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: operator-os
    attributes:
      label: Operator OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: target-os
    attributes:
      label: Controlled-machine OS
      options:
        - Windows
        - macOS
        - Linux
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Replace operational data with values such as relay.example.test and TESTHOST. Quote only the minimal non-sensitive error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real deployment data and generated runtime artifacts.
          required: true
        - label: This is not a vulnerability report; if it is, I will use SECURITY.md.
          required: true
