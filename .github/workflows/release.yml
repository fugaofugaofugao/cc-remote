name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.3.0
        required: true

permissions:
  contents: write

jobs:
  # Build the self-contained unix OpenSSH payloads so a controlled machine never
  # depends on its own openssh components (arm64 + x86_64). Both darwin variants run
  # on macos-14 arm64 runners: macos-arm64 natively, macos-x86_64 via prepare's
  # clang -target x86_64 cross-compile (avoids scarce Intel macos-13 hosted runners).
  prepare-unix-payloads:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os-label: macos-arm64,  runner: macos-14,        los: darwin, arch: arm64, cross: "" }
          - { os-label: macos-x86_64, runner: macos-14,        los: darwin, arch: x86_64, cross: "yes" }
          - { os-label: linux-arm64,  runner: ubuntu-24.04-arm, los: linux,  arch: arm64, cross: "" }
          - { os-label: linux-x86_64, runner: ubuntu-latest,   los: linux,  arch: x86_64, cross: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (macOS native)
        if: matrix.los == 'darwin' && matrix.cross == ''
        run: |
          brew install openssl@3
      - name: Install build deps (Linux)
        if: matrix.los == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl libssl-dev
      - name: Install minimal build deps (macOS cross)
        if: matrix.los == 'darwin' && matrix.cross != ''
        run: brew install pkgconf
      - name: Build ${{ matrix.os-label }} OpenSSH payload
        run: ./scripts/prepare-unix-openssh.sh --os ${{ matrix.los }} --arch ${{ matrix.arch }}
      - name: Upload ${{ matrix.os-label }} payload
        uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.os-label }}
          path: payloads/
          if-no-files-found: error

  prepare-windows-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Windows OpenSSH payload
        run: ./scripts/prepare-windows-openssh.sh
      - name: Upload Windows payload
        uses: actions/upload-artifact@v4
        with:
          name: payload-windows
          path: payloads/windows/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare-unix-payloads, prepare-windows-payload]
    # Freshly-compiled CI payload digests need not match our locally-generated pins.
    env:
      CC_REMOTE_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download all platform payloads
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: payload-*
      - name: Merge payloads into the source tree
        run: |
          # Each artifact unpacks as artifacts/<name>/payloads/<os>/... ; merge each
          # per-OS dir into ./payloads so release.sh sees the full 5-platform set.
          mkdir -p payloads
          for dir in artifacts/*/payloads/*/; do
            [ -d "$dir" ] || continue
            os="$(basename "$dir")"
            mkdir -p "payloads/$os"
            cp -f "$dir"* "payloads/$os/" 2>/dev/null || true
          done
          rm -rf artifacts
          echo "=== payload tree ==="
          find payloads -type f | sort
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release artifacts
        run: ./scripts/release.sh "$RUNNER_TEMP/cc-remote-release" "${{ steps.tag.outputs.tag }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_tag="${{ steps.tag.outputs.tag }}"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if ! git rev-parse -q --verify "refs/tags/$ref_tag" >/dev/null; then
              git tag "$ref_tag" "$GITHUB_SHA"
              git push origin "refs/tags/$ref_tag"
            fi
          fi
          gh release create "$ref_tag" "$RUNNER_TEMP/cc-remote-release"/* \
            --title "$ref_tag" \
            --notes-file "$RUNNER_TEMP/cc-remote-release/release-manifest.txt"
